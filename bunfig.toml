[test]
# PGLite-heavy files otherwise run under Bun's default 20-way concurrency and
# can exhaust the WASM runtime on developer machines. Bun does not expose a
# supported max-concurrency setting here, so plain `bun test` is best-effort;
# `bun run test` is the canonical capped full unit command.
smol = true

# Direct `bun test` keeps the same file exclusions and hermetic preload as the
# default unit tier, but not the wrapper-level concurrency cap. E2E, slow, and
# serial quarantines have named runners (`bun run test:e2e`,
# `bun run test:slow`, `bun run test:serial`) so the default path stays
# hermetic and fast.
pathIgnorePatterns = [
  ".codex-worktrees/**",
  "test/e2e/**",
  "**/*.integration.test.ts",
  "**/*.slow.test.ts",
  "**/*.serial.test.ts",
]

# Test preloads:
# 1. hermetic-preload redirects HOME/GBRAIN_HOME and strips live DB/remote env
#    before project modules import config, raises Bun's default hook timeout, and
#    serializes PGLite schema init so migration-heavy files do not starve hooks.
# 2. legacy-embedding-preload pins gateway defaults for legacy fixtures.
preload = [
  "./test/helpers/hermetic-preload.ts",
  "./test/helpers/legacy-embedding-preload.ts",
]
